<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Escolar</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-school"></i> Admin Colegio</a>
            <span class="navbar-text text-white">
                Sistema de Gestión
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Dashboard Resumen -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-success shadow-sm mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa-solid fa-arrow-up"></i> Total Ingresos</h5>
                        <h3 class="card-text" id="totalIngresos">$0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-danger shadow-sm mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa-solid fa-arrow-down"></i> Total Egresos</h5>
                        <h3 class="card-text" id="totalEgresos">$0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info shadow-sm mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa-solid fa-wallet"></i> Balance Actual</h5>
                        <h3 class="card-text" id="balanceActual">$0.00</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Formulario de Registro -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Registrar Transacción</h5>
                    </div>
                    <div class="card-body">
                        <form id="transaccionForm">
                            <div class="mb-3">
                                <label for="tipo" class="form-label">Tipo de Operación</label>
                                <select class="form-select" id="tipo" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="Ingreso">Ingreso (Entrada de dinero)</option>
                                    <option value="Egreso">Egreso (Salida de dinero)</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select class="form-select" id="categoria" required>
                                    <!-- Las opciones se llenarán por JS según el tipo -->
                                    <option value="" disabled selected>Seleccione el tipo primero...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="monto" class="form-label">Monto ($)</label>
                                <input type="number" class="form-control" id="monto" min="0.01" step="0.01" required placeholder="Ej. 1500.00">
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción / Detalles</label>
                                <textarea class="form-control" id="descripcion" rows="2" required placeholder="Ej. Mensualidad de Juan Pérez, Grado 3"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" id="btnGuardar">
                                <i class="fa-solid fa-save"></i> Guardar Registro
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Registros -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Últimos Registros</h5>
                        <button class="btn btn-sm btn-outline-secondary" id="btnActualizar">
                            <i class="fa-solid fa-rotate-right"></i> Actualizar
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Tipo</th>
                                        <th>Categoría</th>
                                        <th>Descripción</th>
                                        <th class="text-end">Monto</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaTransacciones">
                                    <tr>
                                        <td colspan="5" class="text-center py-4 text-muted">
                                            Cargando datos...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
